<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO搜索引擎优化标签 -->
    <title>芗见山海 - 沉浸式古城山海探索景区官方网站</title>
    <meta name="description" content="欢迎来到芗见山海，开启你的古城探索与沉浸式剧情任务之旅。体验芗芗文创，预订特色套餐与景区门票。">
    <meta name="keywords" content="芗见山海, 古城探索, 剧情任务, 芗芗文创, 景区门票, 旅游套餐">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #0d1b2a;
            color: #e0e1dd;
            overflow-x: hidden;
        }
        /* 导航栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(13, 27, 42, 0.9);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f5d061;
            letter-spacing: 2px;
        }
        nav a {
            color: #e0e1dd;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #f5d061;
        }
        /* 首屏 Banner */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(13, 27, 42, 0.6), rgba(13, 27, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920') center/cover;
            padding: 0 20px;
        }
        .hero h1 {
            font-size: 64px;
            color: #f5d061;
            margin-bottom: 15px;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(245, 208, 97, 0.4);
        }
        .hero p {
            font-size: 20px;
            color: #d8e2dc;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 35px;
            background: #f5d061;
            color: #0d1b2a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #fff;
            transform: translateY(-3px);
        }
        /* 模块容器样式 */
        .section {
            padding: 80px 10%;
            text-align: center;
        }
        .section-title {
            font-size: 32px;
            color: #f5d061;
            margin-bottom: 40px;
            position: relative;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1b263b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(245, 208, 97, 0.2);
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <header>
        <div class="logo">芗见山海</div>
        <nav>
            <a href="#task">剧情任务</a>
            <a href="#explore">古城探索</a>
            <a href="#cultural">芗芗文创</a>
            <a href="#packages">套餐购买</a>
            <a href="#tickets">票务查询</a>
            <a href="#role">我的角色</a>
        </nav>
    </header>

    <!-- 主首屏 -->
    <section class="hero">
        <h1>芗见山海</h1>
        <p>山海有灵 · 入画古城 · 开启你的沉浸式冒险之旅</p>
        <a href="#task" class="btn">开启山海之旅</a>
    </section>

    <!-- 剧情任务 -->
    <section id="task" class="section">
        <h2 class="section-title">剧情任务</h2>
        <div class="cards">
            <div class="card">
                <h3>【主线】山海寻灵记</h3>
                <p style="margin-top:10px; color:#a3b18a;">寻找散落在古城的四大阵眼，解锁隐藏故事。</p>
            </div>
            <div class="card">
                <h3>【支线】古城解谜册</h3>
                <p style="margin-top:10px; color:#a3b18a;">破译老街暗号，赢取限量“芗芗”徽章。</p>
            </div>
        </div>
    </section>

    <!-- 简易的后续模块占位 -->
    <section id="explore" class="section" style="background: #111d2e;">
        <h2 class="section-title">古城探索</h2>
        <p>（实景地图与景点打卡区）</p>
    </section>

</body>
</html>
